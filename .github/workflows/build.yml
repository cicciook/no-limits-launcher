name: Build launcher

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Build desktop app
        run: pyinstaller --noconfirm --clean --windowed --name "No Limits Launcher" --paths src src/nolimits/__main__.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: no-limits-launcher-${{ matrix.artifact }}
          path: dist/
      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
