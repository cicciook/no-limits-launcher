<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 523 128" width="523" height="128">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1f86"/>
      <stop offset="1" stop-color="#110a2a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="inf" gradientUnits="userSpaceOnUse" x1="22" y1="0" x2="98" y2="0">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="limits" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="235.6" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sub" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="357.1" y2="0">
      <stop offset="0" stop-color="#9d94c4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Emblema: badge arrotondato con simbolo dell'infinito -->
  <g id="emblem">
    <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#badge)"/>
    <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#shine)"/>
    <rect x="5.5" y="5.5" width="117" height="117" rx="32.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    <g transform="translate(4 4)">
      <!-- alone -->
      <path d="M24 60 C24 40 46 40 60 60 C74 80 96 80 96 60 C96 40 74 40 60 60 C46 80 24 80 24 60 Z"
            fill="none" stroke="#8b5cf6" stroke-opacity="0.16" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 60 C24 40 46 40 60 60 C74 80 96 80 96 60 C96 40 74 40 60 60 C46 80 24 80 24 60 Z"
            fill="none" stroke="#a78bfa" stroke-opacity="0.26" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
