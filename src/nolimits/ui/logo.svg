<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- NO LIMITS -->
    <text x="10" y="65" font-family="&#39;Segoe UI&#39;, &#39;Arial Black&#39;, sans-serif" font-weight="900" font-style="italic" font-size="62" fill="url(#textGrad)" stroke="#6b21a8" stroke-width="3" letter-spacing="2">NO LIMITS</text>
    <!-- LAUNCHER -->
    <text x="15" y="102" font-family="&#39;Segoe UI&#39;, &#39;Arial Black&#39;, sans-serif" font-weight="900" font-size="28" fill="url(#subGrad)" letter-spacing="8">LAUNCHER</text>
  </g>
</svg>