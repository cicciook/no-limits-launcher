      <path d="M24 60 C24 40 46 40 60 60 C74 80 96 80 96 60 C96 40 74 40 60 60 C46 80 24 80 24 60 Z"
            fill="none" stroke="url(#inf)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26 56 C27 44 44 43 56 56" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
      <!-- scintilla -->
      <path d="M92 22 L94.2 28.8 L101 31 L94.2 33.2 L92 40 L89.8 33.2 L83 31 L89.8 28.8 Z" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="30" cy="90" r="2" fill="#7dd3fc" fill-opacity="0.9"/>
      <circle cx="40" cy="98" r="1.3" fill="#c4b5fd" fill-opacity="0.8"/>
    </g>
  </g>

